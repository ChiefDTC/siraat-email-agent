<!-- BLOCK productcard (research/ux-round2): productkaart met sticker in het beeld (scripts/place_sticker.py).
     Beeld 200 px desktop, 132 px mobiel. Optionele pill als live tekst: pill="BEST SELLER" (leeg = geen).
     img="card-x.jpg" = gedeeld beeld uit partials/shared; img met de IMG-variabele ervoor (dubbele accolades, zie PLAYBOOK 12) = eigen beeld uit de assets-map van de flow.
     was="$439" alleen bij een echte compare-at uit Shopify (PLAYBOOK 12). now leeg en was leeg = geen prijsregel.
     us="1" zet prijsregel en note binnen een if-tag op de US-voorwaarde van de trigger (build_template.py, USCOND), us="price" alleen de prijsregel; uscond="..." overschrijft de voorwaarde. -->
<tr><td class="pad" style="padding:[[pad]];">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="background:#FFFFFF;border:1px solid #ECE7DD;"><tr>
    <td width="200" class="pc-i" valign="middle" style="width:200px;padding:0;"><a href="[[url]]"><img src="[[img]]" width="200" alt="[[alt]]" class="pc-img" style="display:block;width:200px;height:auto;"></a></td>
    <td valign="middle" class="pc-t" style="padding:16px 20px 16px 18px;font-family:Inter,Arial,Helvetica,sans-serif;"><a href="[[url]]" style="text-decoration:none;">
      [[pill]]
      <div class="pc-n" style="font-size:18px;line-height:24px;font-weight:600;color:#282828;">[[name]]</div>
      <div class="pc-s" style="font-size:14px;line-height:20px;color:#727272;padding-top:3px;">[[sub]]</div>
      [[pricehtml]]
      <div style="padding-top:10px;font-size:13px;line-height:16px;letter-spacing:1.5px;font-weight:600;color:#282828;text-transform:uppercase;"><span style="border-bottom:1px solid #282828;padding-bottom:2px;">[[link]]</span> &rarr;</div>
    </a></td>
  </tr></table>
</td></tr>
