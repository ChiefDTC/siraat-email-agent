<!-- BLOCK productcard (research/ux-round2, Gmail-proof herbouw 10 okt 2026, research/v6-golive/14-gmail-ios.md).
     Hybride kaart zonder media queries: twee inline-block tabellen (beeld max 200 px, tekst max 308 px). Op desktop naast elkaar
     (200 + 308 <= 510 px binnenbreedte), op mobiel staat de tekst vanzelf ONDER het beeld, ook in de Gmail-app die geen <style> leest.
     Titel, korte tekst, prijs en link staan altijd binnen de kaart, elk in een eigen cel (geen <a> om blokelementen heen).
     Elk vlak heeft bgcolor-attribuut en inline background-color. Outlook krijgt een ghost table (mso).
     Optionele pill als live tekst: pill="BEST SELLER" (leeg = geen).
     img="card-x.jpg" = gedeeld beeld uit partials/shared; img met de IMG-variabele ervoor (dubbele accolades, zie PLAYBOOK 12) = eigen beeld uit de assets-map van de flow.
     was="$439" alleen bij een echte compare-at uit Shopify (PLAYBOOK 12). now leeg en was leeg = geen prijsregel.
     us="1" zet prijsregel en note binnen een if-tag op de US-voorwaarde van de trigger (build_template.py, USCOND), us="price" alleen de prijsregel; uscond="..." overschrijft de voorwaarde. -->
<tr><td class="pad" style="padding:[[pad]];">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="background-color:#FFFFFF;border:1px solid #ECE7DD;"><tr>
    <td align="center" valign="middle" bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:0;font-size:0;line-height:0;text-align:center;">
      <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="200" valign="middle"><![endif]-->
      <table role="presentation" class="pc-i" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="display:inline-block;vertical-align:middle;width:100%;max-width:200px;background-color:#FFFFFF;"><tr>
        <td bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:0;"><a href="[[url]]"><img src="[[img]]" width="200" alt="[[alt]]" class="pc-img" style="display:block;width:100%;max-width:200px;height:auto;border:0;"></a></td>
      </tr></table>
      <!--[if mso]></td><td width="308" valign="middle"><![endif]-->
      <table role="presentation" class="pc-t" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="display:inline-block;vertical-align:middle;width:100%;max-width:308px;background-color:#FFFFFF;"><tr>
        <td class="pc-tc" bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:16px 20px 16px 18px;font-family:Inter,Arial,Helvetica,sans-serif;text-align:left;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr><td style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;">[[pill]]</td></tr>
            <tr><td class="pc-n" style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:18px;line-height:24px;font-weight:600;color:#282828;"><a href="[[url]]" style="color:#282828;text-decoration:none;">[[name]]</a></td></tr>
            <tr><td class="pc-s" style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#727272;padding-top:3px;">[[sub]]</td></tr>
            <tr><td style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:12px;line-height:17px;color:#727272;">[[pricehtml]]</td></tr>
            <tr><td style="font-family:Inter,Arial,Helvetica,sans-serif;padding-top:10px;font-size:13px;line-height:16px;letter-spacing:1.5px;font-weight:600;color:#282828;text-transform:uppercase;"><a href="[[url]]" style="color:#282828;text-decoration:none;"><span style="border-bottom:1px solid #282828;padding-bottom:2px;">[[link]]</span> &rarr;</a></td></tr>
          </table>
        </td>
      </tr></table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr></table>
</td></tr>
