<!-- BLOCK deadline (urgency-upgrade 7 okt 2026): persoonlijke deadline als klok-tegels, alleen bij een echte unieke code met vervaltijd.
     days = dagen tot het verlopen (48 uur = 2, 72 uur = 3, 14 dagen = 14); amount/unit = de looptijd zoals de pool hem kent (48 HOURS).
     De datum komt uit de Klaviyo-tag today (accounttijdzone) plus days_later: {% today '%Y-%m-%d' as today %}{{ today|days_later:2|format_date_string|date:'D' }}.
     Waarom eerlijk: de code wordt bij verzending toegewezen en vervalt X uur later; de mail gaat om 09:00 lokale tijd, dus op de getoonde dag in de ochtend.
     Accounttijdzone (US/Eastern) ligt nooit later dan de lokale datum van de ontvanger op dat moment, dus de getoonde datum is nooit te laat (hooguit een dag te vroeg, bv. Australie). -->
<tr><td class="pad" style="padding:[[pad]];">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="background:#FFFFFF;border:1px solid #ECE7DD;">
    <tr><td align="center" style="padding:16px 16px 4px 16px;font-family:Inter,Arial,Helvetica,sans-serif;font-size:11px;line-height:14px;letter-spacing:2px;font-weight:600;color:#AC3B19;">[[label]]</td></tr>
    <tr><td align="center" style="padding:6px 12px 0 12px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td class="dl-t" width="92" align="center" bgcolor="#282828" style="background:#282828;border-radius:4px;padding:9px 4px 8px 4px;font-family:Inter,Arial,Helvetica,sans-serif;"><div class="dl-n" style="font-size:26px;line-height:30px;font-weight:600;color:#FFFFFF;">[[amount]]</div><div style="font-size:10px;line-height:13px;letter-spacing:1.5px;font-weight:600;color:#C9C6C0;">[[unit]]</div></td>
        <td width="8" style="font-size:0;line-height:0;">&nbsp;</td>
        <td class="dl-t" width="92" align="center" bgcolor="#282828" style="background:#282828;border-radius:4px;padding:9px 4px 8px 4px;font-family:Inter,Arial,Helvetica,sans-serif;"><div class="dl-n" style="font-size:26px;line-height:30px;font-weight:600;color:#FFFFFF;">[[dday]]</div><div style="font-size:10px;line-height:13px;letter-spacing:1.5px;font-weight:600;color:#C9C6C0;">DAY</div></td>
        <td width="8" style="font-size:0;line-height:0;">&nbsp;</td>
        <td class="dl-t" width="92" align="center" bgcolor="#282828" style="background:#282828;border-radius:4px;padding:9px 4px 8px 4px;font-family:Inter,Arial,Helvetica,sans-serif;"><div class="dl-n" style="font-size:26px;line-height:30px;font-weight:600;color:#FFFFFF;">[[ddate]]</div><div style="font-size:10px;line-height:13px;letter-spacing:1.5px;font-weight:600;color:#C9C6C0;">DATE</div></td>
      </tr></table>
    </td></tr>
    <tr><td align="center" style="padding:10px 18px 16px 18px;font-family:Inter,Arial,Helvetica,sans-serif;font-size:13px;line-height:19px;color:#727272;">[[note]]</td></tr>
  </table>
</td></tr>
