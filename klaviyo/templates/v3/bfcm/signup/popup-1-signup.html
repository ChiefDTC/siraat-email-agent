<!--
BF SIGNUP POP-UP · SCHERM 1 (aanmelding). Mockup, 375 px mobiel, schermvullende overlay. Niet live; bouwen in Alia of Klaviyo-formulieren.
COPY (Floris, 31 okt 2026): "Black Friday Sale is live" / "Up to 70% off. Sign up and get our best picks." / knop "SHOW ME THE DEALS".
GEEN code, geen extra korting, geen "early access" (de sale is al live).
AANNAMES:
  1. "Shop it first" en "best picks": de mails (W1, W1b) leveren de picks; "first" is Floris' formulering, te checken of dat iets concreets betekent.
  2. Achtergrond: siraat-collection-exclusive-07-stage-reveal (Shopify CDN), donker verloop eroverheen voor leesbaarheid.
  3. Logo: lockup wit (brand/logo/lockup/siraat-lockup-white.png).
  4. Toestemmingsregel onder de knop; juridische tekst door Floris te bevestigen.
  5. Na verzenden: profiel in lijst + eigenschap/bron "BF popup" zodat het in het BF-segment valt (FLOW.md).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>BF pop-up 1 · sign up</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:375px;height:812px;background:#0E0E0E;font-family:Inter,Arial,Helvetica,sans-serif;color:#FFFFFF;overflow:hidden}
  .site{position:absolute;inset:0;background:#F8F7F2}
  .overlay{position:absolute;inset:0;background:#0E0E0E url('https://cdn.shopify.com/s/files/1/0907/0877/1156/files/siraat-collection-exclusive-07-stage-reveal-desktop.jpg?width=1600') 62% 0/auto 470px no-repeat}
  .overlay:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,14,.25) 0%,rgba(14,14,14,.15) 30%,rgba(14,14,14,.92) 52%,#0E0E0E 62%)}
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:22px 24px 28px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .logo{width:132px;height:auto;display:block}
  .x{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:#FFFFFF}
  .spacer{flex:1}
  .tag{display:inline-block;background:#FFB800;color:#272727;font-weight:800;font-size:11px;letter-spacing:1.8px;padding:6px 10px;margin-bottom:16px}
  h1{font-weight:900;font-size:42px;line-height:44px;letter-spacing:-1.3px}
  h1 span{background:#FFB800;color:#272727;padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sub{margin-top:16px;font-size:17px;line-height:25px;color:#E6E3DC}
  .sub b{color:#FFFFFF;font-weight:800}
  form{margin-top:24px}
  input{width:100%;height:54px;border-radius:28px;border:1.5px solid #4A4743;background:#1A1918;color:#FFFFFF;font:400 16px Inter,Arial,sans-serif;padding:0 22px}
  input::placeholder{color:#9A958C}
  button{margin-top:12px;width:100%;height:56px;border:0;border-radius:28px;background:#FFB800;color:#272727;font:800 15px Inter,Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
  .no{margin-top:16px;text-align:center;font-size:13px;color:#BDB8AE;text-decoration:underline}
  .legal{margin-top:14px;text-align:center;font-size:11px;line-height:16px;color:#8A857D}
</style>
</head>
<body>
<div class="site"></div>
<div class="overlay">
  <div class="wrap">
    <div class="top">
      <img class="logo" src="../../../../../brand/logo/lockup/siraat-lockup-white.png" alt="Siraat">
      <div class="x" aria-label="Close">&times;</div>
    </div>
    <div class="spacer"></div>
    <div><span class="tag">BLACK FRIDAY</span></div>
    <h1>Black Friday Sale<br><span>is live.</span></h1>
    <p class="sub"><b>Up to 70% off.</b> Sign up and get our best picks.</p>
    <form onsubmit="return false">
      <input type="email" placeholder="Your email address" aria-label="Email address">
      <button type="submit">Show me the deals &rarr;</button>
    </form>
    <div class="no">No thanks</div>
    <p class="legal">By signing up you agree to receive marketing emails from Siraat. Unsubscribe anytime.</p>
  </div>
</div>
</body>
</html>
